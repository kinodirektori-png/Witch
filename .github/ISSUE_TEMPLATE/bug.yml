name: Bug
description: Something in the game or editor tools doesn't work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run Witch > Build MainLab Test Scene
        2. Press Play
        3. Drag ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Unity 6000.6.x, Editor / iPhone 13 iOS 18, commit abc123
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console errors, screenshots or video
